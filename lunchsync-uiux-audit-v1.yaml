  # ────────────────────────────────────────────────────────────────────────────
  # QUALITY — Use Skeleton component instead of custom HTML
  # ────────────────────────────────────────────────────────────────────────────
  - id: "08-use-skeleton-components"
    title: "Replace custom animate-pulse skeleton HTML with Skeleton component in page loading states"
    prompt: |
      ## Context
      Rule 3 in .claude/UI_UX_INSTRUCTIONS.md says: "Use TanStack Query's `isLoading` /
      `isPending` to render `<Skeleton />` for content areas." Three pages build custom
      skeleton HTML with `animate-pulse` and `bg-gray-200` divs instead of using the
      `<Skeleton />` component from `@/components/ui/skeleton`.

      The `Skeleton` component API is simple — it's a div with `animate-pulse rounded-md bg-slate-200`
      that accepts a `className` for sizing:
      ```tsx
      <Skeleton className="h-6 w-3/4" />
      ```

      ## Violations found

      ### File 1: `frontend/src/pages/Events.tsx`
      **Lines ~78-95 — Custom skeleton loading:**
      ```tsx
      if (isLoading) {
        return (
          <div className="p-6">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-2xl font-bold">Events</h1>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {[1, 2, 3].map((i) => (
                <Card key={i} className="p-6 animate-pulse">
                  <div className="h-6 bg-gray-200 rounded w-3/4 mb-4"></div>
                  <div className="h-4 bg-gray-200 rounded w-full mb-2"></div>
                  <div className="h-4 bg-gray-200 rounded w-2/3"></div>
                </Card>
              ))}
            </div>
          </div>
        );
      }
      ```

      **Fix:** Import Skeleton and replace:
      ```tsx
      import { Skeleton } from '@/components/ui/skeleton';
      ...
      if (isLoading) {
        return (
          <div className="p-6">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-2xl font-bold">Events</h1>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {[1, 2, 3].map((i) => (
                <Card key={i} className="p-6">
                  <Skeleton className="h-6 w-3/4 mb-4" />
                  <Skeleton className="h-4 w-full mb-2" />
                  <Skeleton className="h-4 w-2/3" />
                </Card>
              ))}
            </div>
          </div>
        );
      }
      ```

      ### File 2: `frontend/src/pages/Orders.tsx`
      **Lines ~56-72 — Custom skeleton loading:**
      ```tsx
      if (isLoading) {
        return (
          <div className="space-y-6">
            <h1 className="text-3xl font-bold">My Orders</h1>
            <div className="grid grid-cols-1 gap-4">
              {[1, 2, 3].map((i) => (
                <Card key={i} className="animate-pulse">
                  <CardContent className="p-6">
                    <div className="h-6 bg-gray-200 rounded w-3/4 mb-4"></div>
                    <div className="h-4 bg-gray-200 rounded w-full mb-2"></div>
                    <div className="h-4 bg-gray-200 rounded w-2/3"></div>
                  </CardContent>
                </Card>
              ))}
            </div>
          </div>
        );
      }
      ```

      **Fix:**
      ```tsx
      import { Skeleton } from '@/components/ui/skeleton';
      ...
      if (isLoading) {
        return (
          <div className="space-y-6">
            <h1 className="text-3xl font-bold">My Orders</h1>
            <div className="grid grid-cols-1 gap-4">
              {[1, 2, 3].map((i) => (
                <Card key={i}>
                  <CardContent className="p-6">
                    <Skeleton className="h-6 w-3/4 mb-4" />
                    <Skeleton className="h-4 w-full mb-2" />
                    <Skeleton className="h-4 w-2/3" />
                  </CardContent>
                </Card>
              ))}
            </div>
          </div>
        );
      }
      ```

      ### File 3: `frontend/src/pages/MenuManagement.tsx`
      **Lines ~42-51 — Custom skeleton loading:**
      ```tsx
      if (restaurantLoading || menuItemsLoading) {
        return (
          <div className="p-6">
            <div className="animate-pulse">
              <div className="h-8 bg-gray-200 rounded w-1/4 mb-6"></div>
              <div className="h-64 bg-gray-200 rounded"></div>
            </div>
          </div>
        );
      }
      ```

      **Fix:**
      ```tsx
      import { Skeleton } from '@/components/ui/skeleton';
      ...
      if (restaurantLoading || menuItemsLoading) {
        return (
          <div className="p-6">
            <Skeleton className="h-8 w-1/4 mb-6" />
            <Skeleton className="h-64 w-full" />
          </div>
        );
      }
      ```

      After fixing all three, run verification.

    verify:
      - "grep -q \"from '@/components/ui/skeleton'\" frontend/src/pages/Events.tsx"
      - "grep -q '<Skeleton' frontend/src/pages/Events.tsx"
      - "! grep -q 'bg-gray-200' frontend/src/pages/Events.tsx"
      - "grep -q \"from '@/components/ui/skeleton'\" frontend/src/pages/Orders.tsx"
      - "grep -q '<Skeleton' frontend/src/pages/Orders.tsx"
      - "! grep -q 'bg-gray-200' frontend/src/pages/Orders.tsx"
      - "grep -q '<Skeleton' frontend/src/pages/MenuManagement.tsx"
