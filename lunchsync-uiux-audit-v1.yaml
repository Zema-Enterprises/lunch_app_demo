  # ────────────────────────────────────────────────────────────────────────────
  # QUALITY — Use Badge variants instead of getStatusColor
  # ────────────────────────────────────────────────────────────────────────────
  - id: "09-use-badge-variants"
    title: "Replace getStatusColor() functions with proper Badge variant props"
    prompt: |
      ## Context
      Domain 1.6 in .claude/UI_UX_INSTRUCTIONS.md says: "Use `Badge` to display event
      status with color coding" using specific variants:
      - OPEN: `variant="success"` (green)
      - CLOSED: `variant="secondary"` (slate)
      - COMPLETED: `variant="default"` (dark)
      - CANCELLED: `variant="destructive"` (red)

      Three files define a `getStatusColor()` function that returns raw Tailwind classes
      like `bg-green-500` and applies them via `className`, bypassing the Badge variant system.

      The Badge component (in `frontend/src/components/ui/badge.tsx`) supports variants:
      `default`, `secondary`, `destructive`, `outline`, `success`.

      ## Fix

      Create a shared helper function. Add this to the top of each file (or better, to
      a shared utils file, but to minimize changes, add to each file):

      ```tsx
      const getStatusVariant = (status: string): 'success' | 'secondary' | 'default' | 'destructive' => {
        switch (status) {
          case 'OPEN': return 'success';
          case 'CLOSED': return 'secondary';
          case 'COMPLETED': return 'default';
          case 'CANCELLED': return 'destructive';
          default: return 'secondary';
        }
      };
      ```

      ### File 1: `frontend/src/pages/Events.tsx`

      **Remove** the `getStatusColor` function (lines ~31-44).
      **Replace** all `<Badge className={getStatusColor(event.status)}>` with
      `<Badge variant={getStatusVariant(event.status)}>`.

      On line ~164:
      ```tsx
      // BEFORE
      <Badge className={getStatusColor(event.status)}>{event.status}</Badge>
      // AFTER
      <Badge variant={getStatusVariant(event.status)}>{event.status}</Badge>
      ```

      ### File 2: `frontend/src/pages/Orders.tsx`

      **Remove** the `getEventStatusColor` function (lines ~28-41).
      **Replace** all `<Badge className={getEventStatusColor(...)}>` with
      `<Badge variant={getStatusVariant(...)}>`.

      On line ~105:
      ```tsx
      // BEFORE
      <Badge className={getEventStatusColor(order.event?.status || '')}>{order.event?.status}</Badge>
      // AFTER
      <Badge variant={getStatusVariant(order.event?.status || '')}>{order.event?.status}</Badge>
      ```

      Also on line ~250 in the order details section:
      ```tsx
      // BEFORE
      <Badge className={`ml-2 ${getEventStatusColor(selectedOrder.event?.status || '')}`}>{selectedOrder.event?.status}</Badge>
      // AFTER
      <Badge className="ml-2" variant={getStatusVariant(selectedOrder.event?.status || '')}>{selectedOrder.event?.status}</Badge>
      ```

      ### File 3: `frontend/src/components/events/EventDetailsModal.tsx`

      **Remove** the `getStatusColor` function (lines ~42-55).
      **Replace** on line ~91:
      ```tsx
      // BEFORE
      <Badge className={getStatusColor(event.status)}>{event.status}</Badge>
      // AFTER
      <Badge variant={getStatusVariant(event.status)}>{event.status}</Badge>
      ```

      After fixing all three files, run verification.

    verify:
      - "! grep -q 'getStatusColor' frontend/src/pages/Events.tsx"
      - "grep -q 'getStatusVariant' frontend/src/pages/Events.tsx"
      - "! grep -q 'getEventStatusColor' frontend/src/pages/Orders.tsx"
      - "grep -q 'getStatusVariant' frontend/src/pages/Orders.tsx"
      - "! grep -q 'getStatusColor' frontend/src/components/events/EventDetailsModal.tsx"
      - "grep -q 'getStatusVariant' frontend/src/components/events/EventDetailsModal.tsx"
      - "cd frontend && npm run lint 2>&1 | tail -5"

