version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lunchsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunchsync
      POSTGRES_PASSWORD: lunchsync123
      POSTGRES_DB: lunchsync
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchsync"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lunchsync-network

  # Redis Cache (for Socket.IO adapter)
  redis:
    image: redis:7-alpine
    container_name: lunchsync-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lunchsync-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lunchsync-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://lunchsync:lunchsync123@postgres:5432/lunchsync
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://localhost:3000
      INVITE_EMAIL_PROVIDER: resend
      INVITE_TTL_DAYS: 7
      INVITE_EMAIL_FROM: "LunchSync Invites <onboarding@resend.dev>"
      INVITE_EMAIL_REPLY_TO: "support@zemaenterprises.com"
      RESEND_API_KEY: re_8Sr2KdG6_BVErtnZvdivcgPVkEHqbb5BY
      NOTIFICATIONS_REDIS_URL: redis://redis:6379
      NOTIFICATIONS_REDIS_TLS: "false"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && (npm run db:seed || echo 'Skipping seed...') && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lunchsync-network

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lunchsync-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host
    networks:
      - lunchsync-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lunchsync-network:
    driver: bridge
